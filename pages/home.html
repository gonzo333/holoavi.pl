<section class="section">
  <div class="container">
    <h1 class="badge">> Awatary i hologramy przyszłości</h1>
    <h3>Nowoczesne rozwiązania eventowe wsparte AI.</h3>

    <div class="hologram-wrapper">
      <div id="hologram-container">
        <div class="hologram-hud">
          <h3>STATUS:</h3>
          <p id="status-text">Inicjalizacja...</p>
        </div>

        <div id="laser-line" class="laser-line"></div>

        <img
          id="avatar-static-img"
          src="assets/animation-photo.png"
          class="avatar-element avatar-static active scanning"
          alt="Tworzenie awatara"
        />

        <video
          id="avatar-talking-video"
          class="avatar-element avatar-video"
          playsinline
          controlsList="nodownload nofullscreen noremoteplayback"
          disablePictureInPicture
        >
          <source id="talking-source" type="video/webm" />
        </video>

        <video
          id="avatar-idle-video"
          class="avatar-element avatar-video"
          muted
          playsinline
          controlsList="nodownload nofullscreen noremoteplayback"
          disablePictureInPicture
        >
          <source id="idle-source" type="video/webm" />
        </video>

        <video
          id="avatar-question-video"
          class="avatar-element avatar-video"
          muted
          playsinline
          controlsList="nodownload nofullscreen noremoteplayback"
          disablePictureInPicture
        >
          <source id="question-source" type="video/mp4" />
        </video>

        <div id="questionTrigger" class="avatar-question-trigger">
          <div class="avatar-question-bubble">
            Czy mogę otrzymać umowę elektronicznie?
          </div>
          <button
            id="questionArrowBtn"
            class="question-arrow-btn"
            aria-label="Zadaj pytanie: Czy mogę otrzymać umowę elektronicznie?"
          ></button>
        </div>

        <button
          id="refreshBtn"
          class="refresh-btn"
          aria-label="Odtwórz animację od nowa"
        ></button>

        <button
          id="muteToggle"
          class="mute-toggle-btn"
          aria-label="Włącz dźwięk"
        ></button>
      </div>
    </div>
  </div>
</section>
