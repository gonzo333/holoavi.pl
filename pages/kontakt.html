<section class="section">
  <div class="container">
    <div class="page-header">
      <span class="badge">> KONTAKT</span>
      <h1>Napisz do nas</h1>
      <p class="lead">
        Postaramy się odpowiedzieć najszybciej jak to tylko możliwe.
      </p>
    </div>

    <div class="form-wrapper">
      <form id="contactForm" class="card" novalidate>
        <div class="form-group">
          <label for="imie">Jak masz na imie?</label>
          <input
            type="text"
            id="imie"
            name="imie"
            title="Twoje imie np. Agnieszka"
            required
          />
        </div>

        <div class="form-group">
          <label for="email"
            >Adres skrzynki pocztowej do kontaktu z Tobą?</label
          >
          <input
            type="email"
            id="email"
            name="email"
            title="Email kontaktowy np. jankowalski@gmail.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="nrtel"
            >Opcjonalnie: Pod jakim numerem możemy się do Ciebie
            dodzwonić?</label
          >
          <input
            type="tel"
            id="nrtel"
            name="nrtel"
            title="Numer telefonu musi składać się z dokładnie 9 cyfr."
          />
        </div>

        <div class="form-group">
          <label for="wiadomosc">W czym możemy Ci pomóc?</label>
          <textarea
            id="wiadomosc"
            name="wiadomosc"
            rows="5"
            title="Treść zapytania"
            required
          ></textarea>
        </div>

        <button type="submit" id="submitBtn" class="hologram-btn btn-tertiary">
          Wyślij wiadomość
        </button>
      </form>

      <div class="card contact-info-card">
        <h3>Inne sposoby kontaktu</h3>
        <p>
          Możesz też przesłać do nas korespondencję mailowo na adres
          <a href="mailto:kontakt@holoavi.pl">kontakt@holoavi.pl</a>.
        </p>

        <div class="social-links">
          <a
            href="https://www.facebook.com/profile.php?id=61591270506999"
            class="social-link"
            target="_blank"
            rel="noopener"
            aria-label="Napisz do nas na Facebooku"
          >
            <img src="assets/facebook-icon.svg" alt="" width="22" height="22" />
            Napisz do nas na Facebooku
          </a>
        </div>

        <p class="social-widget-notice">
          Wkrótce: widget czatu bezpośrednio na tej stronie.
        </p>
      </div>
    </div>
  </div>
</section>
